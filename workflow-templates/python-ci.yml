name: Python CI

# Starter workflow for FlyGACA repositories built with Python: install requirements, run the unit tests.
# The job is called "test" on purpose: a branch ruleset (rulesets/default-branch.json) requires a check by that name.
on:
  pull_request:
  push:
    branches: [$default-branch]

# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requirements, if the project has any
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - run: python -m unittest discover
