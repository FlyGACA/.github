<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">How the FlyGACA projects connect</title>
  <desc id="d">Official GACA publications (the GACAR regulations and the Saudi eAIP) feed the FlyGACA web platform, the Captain Adel assistant and the saudi-airspace dataset. FlyGACA and Captain Adel feed the native iOS apps. The saudi-airspace dataset and the C172 model feed FlightBag. Gallery is a separate visual library.</desc>
